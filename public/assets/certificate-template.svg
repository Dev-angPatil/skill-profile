<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#bg)"/>
  <rect x="18" y="18" width="564" height="344" rx="12" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
  <rect x="26" y="26" width="548" height="328" rx="8" fill="none" stroke="#334155" stroke-width="1"/>
  
  <!-- Ribbon Seal Badge -->
  <circle cx="300" cy="95" r="32" fill="url(#gold)" filter="drop-shadow(0 4px 12px rgba(217, 119, 6, 0.4))"/>
  <polygon points="300,75 306,88 320,88 309,97 313,110 300,102 287,110 291,97 280,88 294,88" fill="#0f172a"/>

  <!-- Certificate Typography -->
  <text x="300" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#94a3b8" text-anchor="middle">OFFICIAL ATTESTATION OF ACHIEVEMENT</text>
  <text x="300" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle">CERTIFICATE OF PROFICIENCY</text>
  <line x1="220" y1="215" x2="380" y2="215" stroke="url(#gold)" stroke-width="2"/>
  
  <text x="300" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">This certifies that technical mastery has been verified across</text>
  <text x="300" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#38bdf8" text-anchor="middle">Cloud Infrastructure, Python Services &amp; Automated Testing</text>

  <!-- Signatures / Footer metadata -->
  <line x1="120" y1="320" x2="230" y2="320" stroke="#475569" stroke-width="1"/>
  <text x="175" y="335" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">AUTHORIZED VERIFIER</text>

  <line x1="370" y1="320" x2="480" y2="320" stroke="#475569" stroke-width="1"/>
  <text x="425" y="335" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">CRYPTOGRAPHIC REGISTRY</text>
</svg>
